name: Ingesta de Estaciones de Riego

on:
  schedule:
    # Corre cada 30 minutos
    - cron: '*/10 * * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente para probar

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del repositorio
      uses: actions/checkout@v3

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Ejecutar script de ingesta
      env:
        AGOL_USER: ${{ secrets.AGOL_USER }}
        AGOL_PASS: ${{ secrets.AGOL_PASS }}
        AGOL_ITEM_ID: ${{ secrets.AGOL_ITEM_ID }}
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
      run: python main.py